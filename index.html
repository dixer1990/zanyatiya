      const s = stu(i.dataset.sid), v = i.value.trim();
      if (s.rateNext && s.rateNext.from <= today()) { s.rate = +s.rateNext.rate; delete s.rateNext; }
      if (v !== '' && +v >= 0 && +v !== +s.rate) { const same = s.rateNext && +s.rateNext.rate === +v && s.rateNext.from === from; s.rateNext = { from, rate: +v, told: same ? s.rateNext.told : false }; n++; }
      else if (s.rateNext) delete s.rateNext;
    });
    save(); openSheet(sPriceTold); toast(n ? `Новая цена запланирована: ${n} ${plural(n, 'ученик', 'ученика', 'учеников')}` : 'Изменений цены нет', undoTo(u)); refresh();
  },
  priceTold: d => { const s = stu(d.id); if (!s.rateNext) return; s.rateNext.told = !s.rateNext.told; save(); render(); drawSheet(); },
  priceText: d => shareText(priceMsg(stu(d.id))),
  notifyForm: d => openSheet(() => sNotify(d.id)),
  notifyToggle: d => {
    const x = (S.offs || []).find(o => o.id === d.id); if (!x) return;
    x.told = x.told || []; const i = x.told.indexOf(d.s);
    if (i >= 0) x.told.splice(i, 1); else x.told.push(d.s);
    save(); BAL = {}; COV = {}; render(); drawSheet();
  },
  notifyAll: d => {
    const x = (S.offs || []).find(o => o.id === d.id); if (!x) return;
    const act = S.students.filter(s => !s.archived).map(s => s.id);
    x.told = act.every(id => (x.told || []).includes(id)) ? [] : act; save(); render(); drawSheet();
  },
  notifyText: async d => {
    const x = (S.offs || []).find(o => o.id === d.id); if (!x) return; const t = offMessage(x);
    if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(t); toast('Текст скопирован — вставьте в мессенджер'); } catch (e) { toast('Не удалось скопировать'); }
  },
  delOff: d => { const u = snap(); S.offs = (S.offs || []).filter(o => o.id !== d.id); save(); closeSheet(); toast('Выходной убран', undoTo(u)); refresh(); },
  saveLimit: () => { const n = Math.round(+val('f_limit')); if (!(n >= 1)) return toast('Нужно число от 1'); S.limit = n; save(); toast('Сохранено'); refresh(); },
  export: exportData,
  import: () => $('#importFile').click(),
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); },
};

async function exportData() {
  const name = `uchet-kopiya-${today()}.txt`;
  S.lastBackup = today(); save();          // копию засчитываем по нажатию: телефон не всегда сообщает, что файл отправлен
  const json = JSON.stringify(S);
  const file = new File([json], name, { type: 'text/plain' });
  const mark = () => { S.lastBackup = today(); save(); refresh(); toast('Копия сохранена'); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Копия: учёт занятий' }); mark(); return; }
    catch (e) { if (e.name === 'AbortError') { refresh(); return; } }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  mark();
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.students) || !Array.isArray(d.pays)) throw 0;
    const info = `учеников: ${d.students.length}, оплат: ${d.pays.length}${d.lastBackup ? ', копия от ' + fmtD(d.lastBackup) : ''}`;
    if (!confirm(`Заменить текущие данные копией (${info})? Текущие данные будут заменены.`)) return;
    S = fix(d); save(); tab = 'sched'; weekStart = monday(today()); refresh(); toast('Данные загружены из копии');
  } catch (err) { toast('Это не похоже на файл копии'); }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fld = e.target.closest('input,select,textarea'); if (fld && fld !== t && t.contains(fld)) return;
  const f = A[t.dataset.a]; if (f) { e.preventDefault(); f(t.dataset, t, e); }
});
function readRep() { if (!REP) return; const g = i => document.getElementById(i), m = g('f_rym'), c = g('f_rpay'), q = g('f_rprep'), r = g('f_rprog'); if (m) REP.ym = m.value; if (c) REP.pay = c.checked; if (q) REP.prep = q.checked; if (r) REP.prog = r.checked; }
document.addEventListener('change', e => {
  if (e.target.id === 'f_omode') { const w = e.target.value === 'weekly'; $('#offRange').style.display = w ? 'none' : ''; $('#offWeekly').style.display = w ? '' : 'none'; }
  if (e.target.id === 'f_owd') $('#offInfo').innerHTML = offSlotsInfo(+e.target.value);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'stuSearch') return; const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#view .stu').forEach(x => { x.style.display = !q || x.dataset.n.includes(q) ? '' : 'none'; });
});
// настройки во вкладке «Ещё» сохраняются сами, как только поле изменено
document.addEventListener('change', e => {
  const a = { f_tutor: 'saveTutor', f_daymax: 'saveDayMax', f_limit: 'saveLimit', f_calalarm: 'saveCalAlarm' }[e.target.id];
  if (a && tab === 'more' && !sheetFn) A[a]();
});
// при выборе даты/времени показываем нагрузку этого дня
['input', 'change'].forEach(ev => document.addEventListener(ev, e => { if (['f_date', 'f_time', 'f_dur'].includes(e.target.id)) updateDayInfo(); }));
// смена месяца или галочки в отчёте сразу обновляет предпросмотр
document.addEventListener('change', e => { if ((['f_rym', 'f_rpay', 'f_rprep', 'f_rprog'].includes(e.target.id)) && REP) { readRep(); drawSheet(); } });
setInterval(() => { const el = document.getElementById('todayNext'); if (el) el.textContent = todayNext(); }, 30000);
/* листание недель свайпом влево-вправо */
function goWeek(dir) {
  weekStart = addD(weekStart, 7 * dir); render();
  const v = $('#view'); v.classList.remove('inL', 'inR'); void v.offsetWidth; v.classList.add(dir > 0 ? 'inR' : 'inL');
}
let sw = null;
$('#view').addEventListener('touchstart', e => {
  if (tab !== 'sched' || sheetFn || e.touches.length !== 1) { sw = null; return; }
  const t = e.touches[0];
  // у самых краёв экрана — системный жест «назад», его не трогаем
  if (t.clientX < 24 || t.clientX > window.innerWidth - 24) { sw = null; return; }
  sw = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
$('#view').addEventListener('touchend', e => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.t;
  sw = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 1.8 * Math.abs(dy) && dt < 700) goWeek(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('input', e => {
  if (e.target.id === 'f_dur' && e.target.dataset.rate !== undefined) {
    const pr = document.getElementById('f_price');
    if (pr) pr.value = Math.round((+e.target.dataset.rate || 0) * (+e.target.value || 0) / 60);
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'more') render(); });

if (S.hourlyOk === undefined && !S.students.some(s => !s.archived && activeSlots(s.id).some(x => x.dur !== 60))) { S.hourlyOk = true; save(); }
render();
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // пришла новая версия приложения — один раз перезагружаем страницу, чтобы она сразу стала видна
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
