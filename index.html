<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ed">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141716">
<title>Учёт занятий</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f2ed;--card:#fff;--ink:#1d2321;--mut:#6b736f;--line:#e3e0d8;
  --acc:#1f6f6b;--accb:#e3efed;
  --ok:#2c7a4b;--okb:#e3f2e8;--warn:#9a5b00;--warnb:#fcefd6;--bad:#b3261e;--badb:#fbe4e2;
  --field:#fff;--bar:#fff;--soft:#e9e6df;--softink:#8a857c;--icon:#b9b4aa;--ghost:#cfcac0;--none:#aaa;--chip:#eee;--off:#888;
  --task:#8a6fb0;--onacc:#fff;--toast:#222;--toastink:#fff;--toastacc:#8fd3cd;--shade:rgba(0,0,0,.35);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141716;--card:#1f2422;--ink:#e6e9e7;--mut:#9aa39f;--line:#333a37;
  --acc:#5bb8ae;--accb:#1c3532;
  --ok:#4fb57c;--okb:#1a3326;--warn:#e3a640;--warnb:#3a2c13;--bad:#f0756a;--badb:#3d1e1b;
  --field:#262c29;--bar:#1a1e1c;--soft:#2c3330;--softink:#9aa39f;--icon:#6d7672;--ghost:#3d4541;--none:#5e6763;--chip:#2a302d;--off:#7d8682;
  --task:#a58ad0;--onacc:#0f1f1d;--toast:#e6e9e7;--toastink:#141716;--toastacc:#1f6f6b;--shade:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;font-weight:700;font-size:21px;max-width:560px;margin:0 auto}
@keyframes inL{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
main.inL{animation:inL .22s ease-out}main.inR{animation:inR .22s ease-out}
main{max-width:560px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:600}

.banner{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;margin:0 0 8px;font-size:15px}
.banner span{margin-left:auto;font-size:20px;line-height:1}
.banner.warn{background:var(--warnb);color:var(--warn)}
.banner.bad{background:var(--badb);color:var(--bad)}
.banner.info{background:var(--accb);color:var(--acc)}

.weekhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;text-align:center}
.weekhead small{display:block;color:var(--mut)}
.nav{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px}
.link{border:0;background:none;color:var(--acc);padding:8px 0;font-size:15px;display:block}
.link.danger{color:var(--bad)}
.weekhead .link{display:inline;padding:0;font-size:13px}

.day{margin:14px 0 4px}
.dh{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin:0 4px 6px}
.day.today .dh{color:var(--acc);font-weight:700}
.none{color:var(--none);font-size:14px;margin:0 4px}

.les{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:6px 6px 6px 10px;margin-bottom:5px;min-height:48px;border-left:4px solid var(--acc);font-size:15px}
.les .tm{font-weight:700;font-variant-numeric:tabular-nums;width:42px;font-size:14px}
.les .mid{flex:1;min-width:0}
.les .mid b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex:none}
.les small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.stu small{display:block;color:var(--mut);font-size:13px}
.les.done{border-left-color:var(--ok)}
.les.cancel{border-left-color:var(--ghost);opacity:.6}
.les.cancel b{text-decoration:line-through}
.les.due{border-left-color:var(--warn)}
.les.ghost{background:transparent;border:1px dashed var(--ghost);border-left:4px solid var(--ghost);opacity:.8}
.les.ghost b{font-weight:500;color:var(--mut)}
.ic{width:38px;height:38px;border-radius:19px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--card);color:var(--icon);padding:0}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic.due{border-color:var(--ok);color:var(--ok)}
.ic.ok{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.ic.x{background:var(--soft);border-color:var(--soft);color:var(--softink)}
.ic.mv{background:var(--accb);border-color:var(--accb);color:var(--acc)}
.icw{display:flex;flex-direction:column;align-items:center;width:35px;flex:none}
.icw .ic{width:32px;height:32px}
.icw .ic svg{width:17px;height:17px}
.icw small{font-size:9.5px;line-height:1.15;color:var(--acc);text-align:center;white-space:nowrap;margin-top:1px;display:block}
.ic.ph{visibility:hidden}
.acts .ic{width:35px;height:35px}
.acts .ic svg{width:19px;height:19px}
.ic.doc.has{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.les.task{border-left-color:var(--task)}
.les.task.tdone{opacity:.55}.les.task.tdone b{text-decoration:line-through}
.ic.tk.ok{background:var(--task);border-color:var(--task);color:var(--onacc)}
.hwprev{background:var(--accb);color:var(--acc);padding:8px 12px;border-radius:10px;font-size:14px;margin:8px 0}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice button{text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
.choice small{display:block;color:var(--mut);font-size:13px}
textarea{resize:vertical;min-height:70px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--mut);font-size:12px;text-align:right;padding:4px 4px 6px}
.tbl td{text-align:right;padding:7px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.tot td{font-weight:700}
.tasks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tkn{position:relative;width:40px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;color:var(--mut);padding:0}
.tkn.w{background:var(--warnb);border-color:var(--warn);color:var(--warn)}
.tkn.d{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.tkn.weak::after{content:'';position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:5px;background:var(--bad);border:2px solid var(--card)}
.legend{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend i.w{background:var(--warnb);border-color:var(--warn)}.legend i.d{background:var(--ok);border-color:var(--ok)}.legend i.weak{background:var(--bad);border-color:var(--bad);border-radius:5px}
.chart{width:100%;height:auto;display:block;margin:4px 0}
.ch-grid{stroke:var(--line);stroke-width:1}.ch-t{fill:var(--mut);font-size:10px}.ch-v{fill:var(--ink);font-size:11px;font-weight:700}
.ch-line{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--acc);stroke:var(--card);stroke-width:2}.ch-hit{fill:transparent}
.todaybox{background:var(--accb);border-radius:16px;padding:10px 8px 5px;margin:2px 0 12px}
.todaybox .th{display:flex;flex-direction:column;gap:2px;padding:0 4px 8px}
.todaybox .th b{color:var(--acc);font-size:15px}.todaybox .th small{color:var(--acc);font-size:13px}
.todaybox .none{margin:0 4px 8px}
.note.bad{background:var(--badb);color:var(--bad)}
.day.off .dh{color:var(--task);font-weight:700}
.offtag{border:0;background:none;color:var(--task);font:inherit;padding:0;text-decoration:underline;text-transform:none;letter-spacing:0}
.dh .cnt{text-transform:none;letter-spacing:0}.dh .cnt.over{color:var(--bad);font-weight:700}
.free .row{align-items:flex-start}.free .row b{min-width:34px}
#printArea{display:none}
@media print{
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font:12pt/1.45 Arial,sans-serif}
  #printArea h1{font-size:18pt;margin:0 0 4pt}#printArea .rsub{color:#555;margin:0 0 12pt}
  #printArea h2{font-size:13pt;margin:16pt 0 6pt;border-bottom:1px solid #bbb;padding-bottom:3pt}
  #printArea .ritem{font-weight:bold;margin:10pt 0 2pt}#printArea .rkv{margin:0 0 2pt 12pt}
  #printArea p{margin:0 0 4pt}
  @page{margin:18mm}
}
.ic.rub.owe{border-color:var(--bad);color:var(--bad)}
.ic.rub.ok{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--bad);margin-left:6px;vertical-align:middle}

.chip{display:inline-block;font-size:13px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}
.chip.warn{background:var(--warnb);color:var(--warn)}
.chip.bad{background:var(--badb);color:var(--bad)}
.chip.new{background:var(--accb);color:var(--acc);font-size:11px;padding:1px 7px;vertical-align:2px}
.chip.off{background:var(--chip);color:var(--off)}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--acc);color:var(--onacc);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:6}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.stu{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:6px}
.stu>div{flex:1;min-width:0}
.empty{background:var(--card);border-radius:14px;padding:16px;color:var(--mut);margin:10px 0}

.pri,.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accb);color:var(--acc);font-weight:600;min-height:46px}
.pri{background:var(--acc);color:var(--onacc)}
.btn.danger{background:var(--badb);color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns>*{flex:1 1 auto}

.box{background:var(--card);border-radius:14px;padding:14px;margin:8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stats>div{background:var(--card);border-radius:14px;padding:12px}
.stats small{display:block;color:var(--mut);font-size:13px}
.stats b{font-size:20px}
.neg{color:var(--bad)}
.paid{color:var(--ok);font-weight:600}.unp{color:var(--bad);font-weight:600}
label.check{display:flex;align-items:flex-start;gap:10px;color:var(--ink);font-size:15px}
label.check input{width:auto;margin:3px 0 0;transform:scale(1.3);flex:none}
h2{margin:0 40px 4px 0;font-size:21px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin:18px 0 6px}
.muted{color:var(--mut);margin:0 0 8px}
.note{background:var(--warnb);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:14px}
.state{font-weight:600;margin:12px 0}
.state.ok{color:var(--ok)}.state.off{color:var(--off)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--mut)}
.row span small{display:block}
.row:last-child{border-bottom:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px}

label{display:block;font-size:14px;color:var(--mut);margin:10px 0}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.two{display:flex;gap:8px}.two>label{flex:1}

#sheet{position:fixed;inset:0;z-index:20;display:none}
body.sheet-open #sheet{display:block}
body.sheet-open{overflow:hidden}
#sheet .bd{position:absolute;inset:0;background:var(--shade)}
#panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#panel .x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:20px;border:0;background:var(--soft);color:var(--ink);font-size:16px}

#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--toast);color:var(--toastink);padding:11px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30;width:max-content;max-width:92vw;display:flex;gap:14px;align-items:center}
#toast span{flex:1 1 auto}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:var(--toastacc);font-weight:700;padding:0}
</style>
</head>
<body>
<header id="title">Расписание</header>
<main id="view"></main>
<nav><div class="in">
  <button data-a="tab" data-t="sched"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Расписание</button>
  <button data-a="tab" data-t="stu"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.2 0 4 1.4 4.6 4"/></svg>Ученики</button>
  <button data-a="tab" data-t="money"><svg viewBox="0 0 24 24"><path d="M8 20V4h6a4 4 0 0 1 0 8H6M6 16h8"/></svg>Деньги</button>
  <button data-a="tab" data-t="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Ещё</button>
</div></nav>
<div id="sheet"><div class="bd" data-a="close"></div><div id="panel"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept=".txt,.json,text/plain,application/json" hidden>

<script>
'use strict';
const VERSION = '1.15 · 11 ноября 2026';
const KEY = 'uchet-data-v1';

/* ---------- даты ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const wdOf = s => (pd(s).getDay() + 6) % 7 + 1;            // 1 = пн … 7 = вс
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const monday = s => addD(s, 1 - wdOf(s));
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const WDF = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const fmtD = s => { const d = pd(s); return `${WD[wdOf(s) - 1]}, ${d.getDate()} ${MG[d.getMonth()]}`; };
const fmtS = s => { const d = pd(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`; };
const endT = (t, dur) => { const [h, m] = t.split(':').map(Number); const x = h * 60 + m + (+dur || 0); return pad(Math.floor(x / 60) % 24) + ':' + pad(x % 60); };
const rub = n => new Intl.NumberFormat('ru-RU').format(Math.round(n || 0)) + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const val = id => (document.getElementById(id)?.value ?? '').trim();
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? one : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? few : many; };
// сколько дней и занятий по расписанию осталось до экзамена
function examInfo(s) {
  if (!s.examDate || s.examDate < today()) return null;
  const days = daysBetween(today(), s.examDate);
  const left = occ(today(), addD(s.examDate, -1)).filter(o => o.sid === s.id && o.status !== 'cancel' && o.status !== 'done' && !isPast(o)).length;
  return { name: s.exam || 'экзамена', days, left };
}
/* нагрузка по дням и выходные */
const offOf = d => (S.offs || []).find(x => d >= x.from && d <= x.to);
const dayLessons = (d, exclude) => occ(d, d).filter(o => o.status !== 'cancel' && refOf(o) !== exclude);
function dayInfoHtml(d, exclude, time, dur) {
  if (!d) return '';
  const L = dayLessons(d, exclude), n = L.length, off = offOf(d), max = S.dayMax || 6;
  let h = '';
  if (off) h += `<p class="note">${fmtD(d)} — выходной${off.note ? ' (' + esc(off.note) + ')' : ''}</p>`;
  if (time) {
    const s0 = toMin(time), e0 = s0 + (+dur || 60);
    const hit = L.filter(o => { const s1 = toMin(o.time); return s1 < e0 && s0 < s1 + (+o.dur || 60); });
    if (hit.length) h += `<p class="note bad">Пересекается по времени: ${hit.map(o => `${esc(stu(o.sid).name)} ${o.time}–${endT(o.time, o.dur)}`).join(', ')}</p>`;
  }
  const times = L.map(o => `${o.time}–${endT(o.time, o.dur)}`).join(', ');
  if (n + 1 > max) h += `<p class="note bad">Это будет ${n + 1}-е занятие в этот день — больше вашего максимума (${max}).${times ? '<br>Уже стоят: ' + times : ''}</p>`;
  else h += `<p class="muted" style="font-size:13px;margin:6px 0">${n ? `В этот день уже ${n} ${lessonsWord(n)}: ${times}. Это будет ${n + 1}-е из ${max} возможных.` : 'В этот день занятий пока нет.'}</p>`;
  return h;
}
function updateDayInfo() {
  const box = document.getElementById('dayInfo'); if (!box) return;
  box.innerHTML = dayInfoHtml(val('f_date'), box.dataset.ex || '', val('f_time'), +val('f_dur') || +box.dataset.dur || 60);
}
/* подготовка к экзамену: пробники и план по заданиям */
function parseNums(str) {
  const out = new Set();
  for (const part of String(str || '').split(/[,;\s]+/)) {

function taskCard(t) {

// бледные плитки на старом месте перенесённых занятий
function ghosts(from, to) {
  const out = [];
  for (const key in S.ov) {
    const o = S.ov[key]; if (!o.date) continue;
    const [slid, orig] = key.split('|');
    if (o.date === orig || orig < from || orig > to) continue;
    const sl = slotById(slid); if (!sl || !stu(sl.sid)) continue;

function durText(min) { const hh = Math.floor(min / 60), mm = min % 60; return hh ? `${hh} ч${mm ? ' ' + mm + ' мин' : ''}` : `${mm} мин`; }
function todayNext() {
  const t = today(), now = toMin(nowHM());

  if (cur) return `идёт: ${stu(cur.sid).name}, до ${endT(cur.time, cur.dur)}`;
  const nx = L.find(o => toMin(o.time) > now);
  if (nx) return `следующее: ${stu(nx.sid).name} в ${nx.time} — через ${durText(toMin(nx.time) - now)}`;

}

}

    refresh();
  },
  slotForm: d => openSheet(() => sSlot(d.id, d.slot || null)),
  saveSlot: d => {
    const wd = +val('f_wd'), time = val('f_time'), dur = +val('f_dur') || 60, from = val('f_from') || today();
    const every = +val('f_every') === 2 ? 2 : 1, label = val('f_label');
    if (!time) return toast('Укажите время');
    if (d.slot) {
      const sl = slotById(d.slot);
      if (sl.wd === wd && sl.time === time && sl.dur === dur && (sl.every || 1) === every) {
        if ((sl.label || '') !== label) { if (label) sl.label = label; else delete sl.label; save(); refresh(); }
        openSheet(() => sStu(d.id)); return;
      }
      endSlot(sl, from);
    }
    const ns = { id: uid(), sid: d.id, wd, time, dur, from, to: null };
    if (every === 2) ns.every = 2;
    if (label) ns.label = label;
    S.slots.push(ns); save();
    openSheet(() => sStu(d.id)); toast('Расписание сохранено'); refresh();
  },
  delSlot: d => {
    const from = val('f_from') || today();
    if (!confirm(`Убрать это время из расписания начиная с ${fmtD(from)}?`)) return;
    endSlot(slotById(d.slot), from); save(); openSheet(() => sStu(d.id)); refresh();
  },
  payForm: d => openSheet(() => sPay(d.id)),
  payQuick: d => { $('#f_amt').value = d.v; if (d.note) $('#f_note').value = d.note; },
  savePay: d => {
    const amount = +val('f_amt'), date = val('f_date') || today(), note = val('f_note');
    if (!(amount > 0)) return toast('Введите сумму');
    const u = snap();
    S.pays.push({ id: uid(), sid: d.id, date, amount, note });
    const s = stu(d.id); let extra = '';
    if (s.remind === undefined && s.rate > 0 && amount >= 2 * typicalPrice(d.id)) { s.remind = true; extra = '. Напомню, когда оплаченные занятия закончатся'; }
    save();
    openSheet(() => sStu(d.id)); toast(`Оплата ${rub(amount)} записана${extra}`, undoTo(u)); refresh();
  },
  payDel: d => {
    const p = S.pays.find(x => x.id === d.p);
    if (!p || !confirm(`Удалить оплату ${rub(p.amount)} от ${fmtS(p.date)}?`)) return;
    const u = snap(); S.pays = S.pays.filter(x => x !== p); save(); toast('Оплата удалена', undoTo(u)); refresh();
  },
  arch: d => {
    const s = stu(d.id);
    if (!confirm(`Перенести «${s.name}» в архив? Постоянные занятия начиная с завтра уберутся из расписания. Оплаты и история сохранятся.`)) return;
    for (const sl of S.slots.filter(x => x.sid === d.id && (!x.to || x.to > today()))) endSlot(sl, addD(today(), 1));
    s.archived = true; save(); closeSheet(); refresh();
  },
  unarch: d => { stu(d.id).archived = false; save(); toast('Возвращён. Добавьте постоянное время заново'); refresh(); },
  delStu: d => {
    const s = stu(d.id);
    if (!confirm(`Удалить «${s.name}» навсегда вместе со всеми занятиями и оплатами? Это не отменить.`)) return;
    const ids = new Set(S.slots.filter(x => x.sid === d.id).map(x => x.id));
    for (const k in S.ov) if (ids.has(k.split('|')[0])) delete S.ov[k];
    S.slots = S.slots.filter(x => x.sid !== d.id); S.extra = S.extra.filter(x => x.sid !== d.id);
    S.pays = S.pays.filter(x => x.sid !== d.id); S.students = S.students.filter(x => x.id !== d.id);
    save(); closeSheet(); refresh();
  },

  planForm: d => openSheet(() => sPlan(d.id)),
  savePlan: d => {
    const n = Math.round(+val('f_pn')); if (!(n >= 1 && n <= 60)) return toast('Нужно число от 1 до 60');
    const s = stu(d.id); s.plan = { n, st: (s.plan && s.plan.st) || {} }; save(); openSheet(() => sStu(d.id)); refresh();
  },
  delPlan: d => { const u = snap(); delete stu(d.id).plan; save(); openSheet(() => sStu(d.id)); toast('План удалён', undoTo(u)); refresh(); },
  planCycle: d => {
    const s = stu(d.id); if (!s || !s.plan) return; s.plan.st = s.plan.st || {};
    const cur = s.plan.st[d.n] || '', next = cur === '' ? 'w' : cur === 'w' ? 'd' : '';
    if (next) s.plan.st[d.n] = next; else delete s.plan.st[d.n];
    save(); drawSheet();
  },
  mockForm: d => openSheet(() => sMock(d.id, d.m || null)),
  saveMock: d => {
    const s = stu(d.id), date = val('f_mdate') || today(), sc = val('f_mscore'), mx = val('f_mmax');
    if (sc === '') return toast('Введите балл');
    const rec = { date, title: val('f_mtitle'), score: +sc, max: mx === '' ? '' : +mx, miss: val('f_mmiss') };
    s.mocks = s.mocks || [];
    if (d.m) Object.assign(s.mocks.find(x => x.id === d.m), rec); else s.mocks.push({ id: uid(), ...rec });
    save(); openSheet(() => sStu(d.id)); toast('Пробник сохранён'); refresh();
  },
  delMock: d => { const u = snap(), s = stu(d.id); s.mocks = (s.mocks || []).filter(x => x.id !== d.m); save(); openSheet(() => sStu(d.id)); toast('Пробник удалён', undoTo(u)); refresh(); },
  mockTip: d => { const m = (stu(d.id).mocks || []).find(x => x.id === d.m); if (m) toast(`${m.title || 'Пробник'} ${fmtS(m.date)}: ${+m.score}${m.max ? ' из ' + (+m.max) : ''}`); },
  saveDayMax: () => { const n = Math.round(+val('f_daymax')); if (!(n >= 1)) return toast('Нужно число от 1'); S.dayMax = n; save(); toast('Сохранено'); refresh(); },
  newOff: () => openSheet(() => sOff(null)),
  openOff: d => openSheet(() => sOff(d.id)),
  saveOff: d => {
    const from = val('f_ofrom'), to0 = val('f_oto') || from, note = val('f_onote');
    if (!from) return toast('Укажите дату');
    const to = to0 < from ? from : to0, u = snap();
    S.offs = S.offs || [];
    if (d.id) Object.assign(S.offs.find(o => o.id === d.id), { from, to, note });
    else S.offs.push({ id: uid(), from, to, note });
    const L = occ(from, to).filter(o => !o.status);
    let msg = d.id ? 'Сохранено' : 'Выходной добавлен';
    if (L.length && confirm(`На эти дни стоит ${L.length} ${lessonsWord(L.length)}. Отменить ${L.length === 1 ? 'его' : 'их'}?`)) {
      for (const o of L) setOcc(o, { status: 'cancel' });
      msg += `, отменено занятий: ${L.length}`;
    }
    save(); closeSheet(); toast(msg, undoTo(u)); refresh();
  },
  delOff: d => { const u = snap(); S.offs = (S.offs || []).filter(o => o.id !== d.id); save(); closeSheet(); toast('Выходной убран', undoTo(u)); refresh(); },
  saveLimit: () => { const n = Math.round(+val('f_limit')); if (!(n >= 1)) return toast('Нужно число от 1'); S.limit = n; save(); toast('Сохранено'); refresh(); },
  export: exportData,
  import: () => $('#importFile').click(),
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); },
};

async function exportData() {
  const name = `uchet-kopiya-${today()}.txt`;
  const json = JSON.stringify(S);
  const file = new File([json], name, { type: 'text/plain' });
  const mark = () => { S.lastBackup = today(); save(); refresh(); toast('Копия сохранена'); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Копия: учёт занятий' }); mark(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  mark();
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.students) || !Array.isArray(d.pays)) throw 0;
    const info = `учеников: ${d.students.length}, оплат: ${d.pays.length}${d.lastBackup ? ', копия от ' + fmtD(d.lastBackup) : ''}`;
    if (!confirm(`Заменить текущие данные копией (${info})? Текущие данные будут заменены.`)) return;
    S = fix(d); save(); tab = 'sched'; weekStart = monday(today()); refresh(); toast('Данные загружены из копии');
  } catch (err) { toast('Это не похоже на файл копии'); }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const f = A[t.dataset.a]; if (f) { e.preventDefault(); f(t.dataset, t, e); }
});
function readRep() { if (!REP) return; const m = document.getElementById('f_rym'), c = document.getElementById('f_rpay'), q = document.getElementById('f_rprep'); if (m) REP.ym = m.value; if (c) REP.pay = c.checked; if (q) REP.prep = q.checked; }
// при выборе даты/времени показываем нагрузку этого дня
['input', 'change'].forEach(ev => document.addEventListener(ev, e => { if (['f_date', 'f_time', 'f_dur'].includes(e.target.id)) updateDayInfo(); }));
// смена месяца или галочки в отчёте сразу обновляет предпросмотр
document.addEventListener('change', e => { if ((['f_rym', 'f_rpay', 'f_rprep'].includes(e.target.id)) && REP) { readRep(); drawSheet(); } });
setInterval(() => { const el = document.getElementById('todayNext'); if (el) el.textContent = todayNext(); }, 30000);
/* листание недель свайпом влево-вправо */
function goWeek(dir) {
  weekStart = addD(weekStart, 7 * dir); render();
  const v = $('#view'); v.classList.remove('inL', 'inR'); void v.offsetWidth; v.classList.add(dir > 0 ? 'inR' : 'inL');
}
let sw = null;
$('#view').addEventListener('touchstart', e => {
  if (tab !== 'sched' || sheetFn || e.touches.length !== 1) { sw = null; return; }
  const t = e.touches[0];
  // у самых краёв экрана — системный жест «назад», его не трогаем
  if (t.clientX < 24 || t.clientX > window.innerWidth - 24) { sw = null; return; }
  sw = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });
$('#view').addEventListener('touchend', e => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.t;
  sw = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 1.8 * Math.abs(dy) && dt < 700) goWeek(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('input', e => {
  if (e.target.id === 'f_dur' && e.target.dataset.rate !== undefined) {
    const pr = document.getElementById('f_price');
    if (pr) pr.value = Math.round((+e.target.dataset.rate || 0) * (+e.target.value || 0) / 60);
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'more') render(); });

if (S.hourlyOk === undefined && !S.students.some(s => !s.archived && activeSlots(s.id).some(x => x.dur !== 60))) { S.hourlyOk = true; save(); }
render();
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  // пришла новая версия приложения — один раз перезагружаем страницу, чтобы она сразу стала видна
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
